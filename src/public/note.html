<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Audio Note</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <a href="/">Audio Notes</a>
    <nav>
      <a href="/architecture.html">Architecture</a>
    </nav>
  </header>

  <main>
    <p><a href="/" class="subtle">&larr; Back to all notes</a></p>
    <div class="note-title-row">
      <h1 id="note-title">Loading&hellip;</h1>
      <button type="button" class="danger" id="delete-btn">Delete</button>
    </div>
    <p class="subtle" id="note-meta"></p>

    <audio id="audio-player" controls></audio>

    <div class="stepper" id="steps">
      <div class="stepper-step" data-step="uploaded">
        <div class="stepper-circle">1</div>
        <div class="stepper-label">Uploaded</div>
      </div>
      <div class="stepper-line"></div>
      <div class="stepper-step" data-step="transcribing">
        <div class="stepper-circle">2</div>
        <div class="stepper-label">Transcribing</div>
      </div>
      <div class="stepper-line"></div>
      <div class="stepper-step" data-step="summarizing">
        <div class="stepper-circle">3</div>
        <div class="stepper-label">Summarizing</div>
      </div>
      <div class="stepper-line"></div>
      <div class="stepper-step" data-step="done">
        <div class="stepper-circle">4</div>
        <div class="stepper-label">Done</div>
      </div>
    </div>

    <div class="error-box" id="note-error"></div>

    <div id="note-body"></div>
  </main>

  <script src="/app.js"></script>
  <script>
    initNotePage();
  </script>
</body>
</html>
