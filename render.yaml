services:
  - type: web
    name: audio-notes
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: DATA_DIR
        value: /data
      - key: GNANI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
    disk:
      name: audio-notes-data
      mountPath: /data
      sizeGB: 1
