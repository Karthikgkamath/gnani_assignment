services:
  - type: web
    name: audio-notes
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /
    envVars:
      - key: DATA_DIR
        value: /data
      - key: GNANI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
    disk:
      name: audio-notes-data
      mountPath: /data
      sizeGB: 1
